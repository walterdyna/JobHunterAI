services:
  - type: web
    name: jobhunter-ai
    runtime: node
    plan: free
    buildCommand: npm ci --prefix frontend && npm run build --prefix frontend && npm ci --prefix backend
    startCommand: npm start --prefix backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DB_CLIENT
        value: postgres
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: AUTOMATION_ENABLED
        value: false
